# Boot settings for nie-os and nie-ostd-vfs. The kernel with the Linux ABI is built from
# vendor/asterinas by `cargo xtask os boot` with the same QEMU arguments.
[boot]
method = "grub-rescue-iso"

[grub]
boot_protocol = "multiboot2"

[qemu]
args = "$(cargo run -q --manifest-path ../xtask/Cargo.toml -- os qemu)"
