# Inazuma Eleven Official Portal theme pack (inazuma.jp tokens + M3 OKLCH tonal spot).
# Source hexes verified against live https://www.inazuma.jp/ CSS (Navy #082475, Cyan #3ec4e9, Gold #ffe900).
id = "inazuma"
name = "Inazuma"

[title]
product_name = "Azalée"
window_title_template = "{page} - Azalée"
ntp_heading = "Inazuma Eleven"

[logo]
mark = "packages/rg-assets/public/ie.webp"
monochrome = "packages/rg-assets/public/RG_Logo_V2.5_NB.webp"

[color]
seed = "oklch(0.55 0.142 264)"
source = "seed"
variant = "tonal-spot"
contrast = 0.0
mode = "light"

[color.secondary]
hue = 221
chroma = 0.123

[icons]
set = "phosphor"
style = "outlined"
weight = 400

[[wallpapers]]
file = "packages/rg-assets/public/sky.webp"
license = "LicenseRef-RoseGriffon-Proprietary"
source = "rosegriffon:packages/rg-assets/public/sky.webp"
fit = "cover"
focal = [50, 35]
sha256 = "9c79040c4af8367ee12801d166e48952b10dcd043babcd81f318a72a07238205"

[pet]
id = "markvr"
provider = "pack"
name = "Mark"
anchor = "bottom-right"
states = ["hello"]
size = 96

[pet.files]
hello = "packages/rg-assets/public/markvr.webp"

[typography]
display = "Noto Sans JP"
body = "Noto Sans JP"
mono = "Geist Mono"

[shell]
layout = "sidebar"
density = 0
radius = [4, 8, 12]
glass_blur = 0
motion = "calm"
