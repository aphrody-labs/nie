# NIE Pixel-Perfect theme pack (crates/aphrody-nie-ui color & surface tokens).
# Source hexes verified in crates/aphrody-nie-ui/src/color.rs (#131420 abysse, #97c0fc cyan, #e6c961 ambre).
id = "nie"
name = "NIE Studio"

[title]
product_name = "NIE Azalée"
window_title_template = "{page} - NIE Studio"
ntp_heading = "NIE Studio"

[logo]
mark = "packages/rg-assets/public/ievr.webp"
monochrome = "packages/rg-assets/public/RG_Logo_V2.5_NB.webp"

[color]
seed = "oklch(0.55 0.096 258)"
source = "seed"
variant = "tonal-spot"
contrast = 0.0
mode = "dark"

[color.secondary]
hue = 94
chroma = 0.128

[icons]
set = "phosphor"
style = "outlined"
weight = 400

[[wallpapers]]
file = "packages/rg-assets/public/markogvr.webp"
license = "LicenseRef-RoseGriffon-Proprietary"
source = "rosegriffon:packages/rg-assets/public/markogvr.webp"
fit = "cover"
focal = [50, 40]
sha256 = "d97f7e4ce9fd9638f19d44076dbd55f4e8a34310a308bfce15d035ca23dddfee"

[pet]
id = "vr"
provider = "pack"
name = "Unmei"
anchor = "bottom-right"
states = ["hello"]
size = 96

[pet.files]
hello = "packages/rg-assets/public/vr.webp"

[typography]
display = "Noto Sans JP"
body = "Inter"
mono = "Geist Mono"

[shell]
layout = "sidebar"
density = 0
radius = [4, 8, 12]
glass_blur = 0
motion = "calm"
