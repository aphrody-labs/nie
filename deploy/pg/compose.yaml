# nie-owned Postgres: the game data (schema `nie`, tables `inagle_*`) moved out of Rose Griffon's inagle-pg.
# Host layout on prd: this file at /srv/nie/pg/compose.yaml, data in /srv/nie/pg/data, credentials in
# /etc/nie/pg.env (POSTGRES_PASSWORD, 0600, never in the repo). Loopback and mesh only, never public.
#   docker compose -f /srv/nie/pg/compose.yaml --env-file /etc/nie/pg.env up -d
name: nie-pg
services:
  nie-pg:
    image: postgres:18.6-alpine
    container_name: nie-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: nie
      POSTGRES_DB: nie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /etc/nie/pg.env}
    ports:
      - "127.0.0.1:15434:5432"
      - "10.200.77.5:15434:5432"
    volumes:
      - /srv/nie/pg/data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nie -d nie"]
      interval: 10s
      timeout: 5s
      retries: 6
