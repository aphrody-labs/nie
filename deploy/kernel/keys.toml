# Signing keys of the kernel release process. The fingerprints are the trust anchor: a key file downloaded
# from the kernel.org pgpkeys repository (keys/<long key id>.asc) is accepted only when its primary
# fingerprint equals one of these. Cross-checked on 2026-11-19 against the WKD of kernel.org (gpg --locate-keys).
keyserver = "https://git.kernel.org/pub/scm/docs/kernel/pgpkeys.git/plain/keys"

[[key]]
name = "Linus Torvalds"
fingerprint = "ABAF11C65A2970B130ABE3C479BE3E4300411886"
signs = ["tag"]

[[key]]
name = "Greg Kroah-Hartman"
fingerprint = "647F28654894E3BD457199BE38DBBDC86092693E"
signs = ["tag", "sha256sums"]

[[key]]
name = "Sasha Levin"
fingerprint = "E27E5D8A3403A2EF66873BBCDEA66FF797772CDC"
signs = ["tag", "sha256sums"]
