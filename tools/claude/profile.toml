# Claude Code profile for nie, applied by the profile script of aphrody-labs/claude (`~/.claude/scripts/profile.ts`):
# renders `.claude/settings.json` and the per-project MCP toggles; `--check` reports drift.
# Minimal by design: only what the plan in docs needs; everything else is off for this repository.

[mcp]
allow = [
  "nie",           # .mcp.json: native nie MCP server (RE, VFS, CLI), JSON in and out
  "context7",      # live library docs (wgpu, russh, gix, gpui, rustls)
  "claude-bridge", # cross-session sync between workers
  "hostinger",     # prd: CachyOS conversion, snapshots, console break-glass
  "cloudflare",    # nie.aphrody.app origin and edge
]

[plugins]
"rust-analyzer-lsp@claude-plugins-official" = false
"clangd-lsp@claude-plugins-official" = false
"pyright-lsp@claude-plugins-official" = false
"csharp-lsp@claude-plugins-official" = false
"gopls-lsp@claude-plugins-official" = false
"typescript-lsp@claude-plugins-official" = false
"document-skills@anthropic-agent-skills" = false
"example-skills@anthropic-agent-skills" = false

[skills]
on = [
  "aphrody:rust-cargo", "rust-upstream", "async-design", "perf-math",
  "aphrody:wgpu", "aphrody:webgpu", "aphrody:wasm-bindgen", "aphrody:webassembly",
  "aphrody:emscripten", "aphrody:gpui",
  "aphrody:ie-game-formats",
  "aphrody:win32", "aphrody:steam",
  "aphrody:fleet", "aphrody:gh-fork", "aphrody:linux-kernel", "aphrody:kernel-watch",
  "aphrody:claude-live-bridge",
]
name_only = []

# Written verbatim into .claude/settings.json: the nie output style and the auto-restart goal hook.
[settings]
outputStyle = "nie"

[settings.statusLine]
type = "command"
command = "bun --no-install --no-env-file tools/claude/statusline.ts"
refreshInterval = 30

[[settings.hooks.Stop]]
[[settings.hooks.Stop.hooks]]
type = "command"
command = "bun --no-install --no-env-file tools/claude/goal-stop.ts"
timeout = 10
