# SPDX-License-Identifier: Apache-2.0
# Standalone on purpose (own `[workspace]`): it runs on the build host against a clone of the
# aphrody-labs/zed fork and never joins the nie workspace graph.
[workspace]

[package]
name = "zed-branch"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/nie"
authors = ["nie contributors"]
publish = false
description = "Regenerates the `nie` branch of the aphrody-labs/zed fork: the Apache-2.0 GPUI closure of upstream main, with registry-only dependencies."

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0.154"
toml_edit = "0.25.19"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
