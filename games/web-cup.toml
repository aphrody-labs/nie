# Web Cup: a 4v4 quick match played in the browser by the Bevy game compiled to WebAssembly.
schema = 1

[game]
id = "web-cup"
name = "Web Cup"
version = "0.1.0"
mode = "exhibition"
frontend = "bevy_web"

[rules]
players_per_side = 4
match_seconds = 30
pitch_length = 32.0
pitch_width = 20.0
goal_width = 5.0
seed = 21

[art]
style = "toon"
camera = "top_down"
pitch_color = [60, 140, 70]

[teams.home]
formation = "1-2"

[teams.away]
formation = "2-1"
