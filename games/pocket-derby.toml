# Pocket Derby: arcade 5v5 on a compact pitch, played in the native Bevy 3D game.
schema = 1

[game]
id = "pocket-derby"
name = "Pocket Derby"
version = "0.1.0"
mode = "exhibition"
frontend = "bevy3d"

[rules]
players_per_side = 5
tick_rate = 60
match_seconds = 60
pitch_length = 40.0
pitch_width = 24.0
goal_width = 6.0
seed = 7

[art]
style = "lowpoly"
camera = "broadcast"
pitch_color = [46, 125, 62]

[teams.home]
formation = "1-2-1"
controller = "human"

[teams.away]
formation = "2-1-1"
controller = "ai"
