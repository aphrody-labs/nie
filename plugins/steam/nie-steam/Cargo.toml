# SPDX-License-Identifier: Apache-2.0
[package]
publish = false
name = "nie-steam"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Steam plugin of nie: VDF text/binary parser and writer, install and library discovery, client configuration, Proton launch tuning, Remote Play state, native depot client over steamroom."

[lints]
workspace = true

[features]
default = []
depot = [
  "dep:anyhow",
  "dep:bytes",
  "dep:dirs-next",
  "dep:hex",
  "dep:reqwest",
  "dep:steamroom",
  "dep:steamroom-client",
  "dep:tokio",
  "dep:tracing",
  "dep:zip",
]

[dependencies]
nie-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true, features = ["std"] }
anyhow = { workspace = true, features = ["std"], optional = true }
bytes = { version = "1.12.1", features = ["serde"], optional = true }
dirs-next = { version = "2.0.0", optional = true }
hex = { version = "0.4.3", optional = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { workspace = true, features = ["std"], optional = true }
zip = { version = "9.6.0", default-features = false, features = ["deflate"], optional = true }
steamroom = { workspace = true, optional = true }
steamroom-client = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = { workspace = true }
