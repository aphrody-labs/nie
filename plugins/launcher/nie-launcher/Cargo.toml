[package]
name = "nie-launcher"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false
description = "Native Rust launcher, save editor, and mod package manager for Inazuma Eleven: Victory Road"

[lints]
workspace = true

[dependencies]
nie-plugin = { workspace = true }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["std", "derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
base64 = "0.23.1"
sha2 = "0.11.1"
hmac = "0.13"
pbkdf2 = "0.13"
aes-gcm = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }
rand = "0.10.4"
