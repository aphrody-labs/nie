[package]
name = "nie-save"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false
description = "Read, decrypt, inspect, and edit Inazuma Eleven: Victory Road save data"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[features]
crlib = []
default = []
# Runs the tests that read a real save file from a game install.
real-saves = []
serde = ["dep:serde", "nie-formats/serde"]

[dependencies]
nie-plugin = { workspace = true }
nie-formats = { workspace = true, default-features = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["std", "derive"], optional = true }

[dev-dependencies]
tempfile = "3.27"
