[package]
name = "nie-camera"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false
description = "Reverse-engineering model, G4CM codec, configuration and memory tools for Inazuma Eleven: Victory Road"

[lints]
workspace = true

[[bin]]
name = "nie-cam"
path = "src/bin/nie-cam.rs"
required-features = ["host"]

[features]
default = ["host"]
bevy = ["dep:bevy_ecs", "dep:bevy_math"]
host = [
  "dep:anyhow",
  "dep:clap",
  "dep:nie-index",
  "nie-index/host",
  "dep:nie-trace",
  "dep:sha2",
]

[dependencies]
nie-formats = { path = "../../../crates/nie-formats", version = "1.4.8", default-features = true }
nie-trace = { path = "../nie-trace", version = "1.4.8", optional = true, default-features = true }
nie-index = { path = "../nie-index", version = "1.4.8", optional = true, default-features = true }
sha2 = { workspace = true, optional = true }
thiserror = { version = "2.0.21" }
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", optional = true, features = [
  "derive",
  "color",
  "env",
] }
bevy_ecs = { workspace = true, optional = true }
bevy_math = { workspace = true, optional = true }
