[package]
name = "nie-index"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Bounded in-memory and SQLite-backed knowledge index for reverse engineering"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[features]
crlib = []
default = ["host"]
host = [
  "dep:anyhow",
  "dep:ignore",
  "dep:r2d2",
  "dep:redis",
  "dep:rusqlite",
  "dep:serde_json",
  "dep:sha2",
  "dep:tantivy",
  "dep:tracing",
]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
anyhow = { workspace = true, features = ["std"], optional = true }
ignore = { version = "0.4", optional = true }
rusqlite = { version = "0.43", optional = true, features = ["bundled"] }
sha2 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
r2d2 = { version = "0.8", optional = true }
redis = { workspace = true, optional = true, features = ["r2d2"] }
tantivy = { version = "0.27.0", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
