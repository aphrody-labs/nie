# SPDX-License-Identifier: Apache-2.0
[package]
name = "nie-re-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository.workspace = true
keywords = ["reverse-engineering", "pe64", "disassembly", "nie"]
categories = ["development-tools::debugging", "parser-implementations"]
description = "Consolidated reverse engineering core (façade over nie-re): PE/ELF/Mach-O triage, strings, x86-64 disassembly, ASAR/Electron/Go/Adobe/Android/SteamStub/minidump inspection, AOB scanning, live memory recovery."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[features]
crlib = []
default = ["pipeline"]
nie = ["dep:nie-index", "nie-index/host", "dep:anyhow", "dep:tracing"]
decompile = ["nie-re/decompile"]
wasm = ["nie-re/wasm"]
pipeline = ["nie-re/pipeline"]

[dependencies]
nie-plugin = { workspace = true }
nie-re = { path = "../nie-re", version = "2.0.0", default-features = false }
goblin = { version = "0.10", default-features = false, features = [
  "std",
  "endian_fd",
  "pe32",
  "pe64",
  "elf32",
  "elf64",
  "mach32",
  "mach64",
] }
hex = "0.4"
serde_json = "1.0.154"
iced-x86 = "1.22"
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
anyhow = { workspace = true, optional = true }
nie-index = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0.154"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bin]]
name = "nie-re-core"
path = "src/bin/nie-re-core/main.rs"

[[bench]]
name = "triage"
harness = false
