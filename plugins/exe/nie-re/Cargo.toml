[package]
name = "nie-re"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reverse-engineering core of nie.exe: PE/ELF/Mach-O triage, x86-64 disassembly, byte-exact PE64 forge and COFF, .pdata and minidump readers, Ghidra P-Code lifting and Pseudo-C, staged recompilation pipeline"
keywords = [
  "reverse-engineering",
  "ghidra",
  "disassembler",
  "pe",
  "binary-analysis",
]
categories = ["development-tools::debugging", "parser-implementations"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
crlib = []
default = ["pipeline"]
pipeline = ["dep:tempfile", "dep:process-wrap"]
decompile = ["dep:ghidra-decompiler"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
# Core workspace dependencies (all crates.io-backed)
blake3 = { workspace = true, features = ["mmap", "rayon"] }
goblin = "0.10.7"
iced-x86 = { version = "1.22.0", features = ["std", "decoder", "intel", "fast_fmt", "instr_info"] }
rustc-hash = "2.1.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
walkdir = "2.5.0"
flate2 = { workspace = true }

# Standard crates.io RE libraries used by nie-re-core and nie-pe
aes = "0.9.4"
md5 = { package = "md-5", version = "0.11.0" }
hex = "0.4"
memchr = "2"
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
wasm-bindgen = { workspace = true, optional = true }

# Optional feature-gated dependencies
tempfile = { workspace = true, optional = true }
process-wrap = { version = "10.0.1", optional = true, default-features = false, features = ["std", "process-group", "job-object"] }
ghidra-decompiler = { version = "2.1.0", optional = true }

[lints]
workspace = true

