[package]
name = "nie-re"
version = "1.4.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified reverse engineering core: PE/ELF/Mach-O triage, byte-exact PE64 forge/COFF, .pdata/minidump/ASAR/Electron/Go/Android/SteamStub inspection, Ghidra P-Code/Pseudo-C & ghidra-decompiler, MinGW-REA, Lua 5.2, CRIWARE CPK/CRILAYLA, DBXV2 formats, AOB/live memory, YARA-X, Magika"
keywords = [
  "reverse-engineering",
  "ghidra",
  "disassembler",
  "pe",
  "binary-analysis",
]
categories = ["development-tools::debugging", "parser-implementations"]

[features]
default = ["game", "pipeline"]
game = ["dep:memmap2"]
pipeline = ["dep:tempfile", "dep:process-wrap"]
decompile = ["dep:ghidra-decompiler"]
magika = ["dep:magika", "dep:ort"]
leveldb = ["dep:rusty-leveldb", "dep:tempfile"]
yara = ["dep:yara-x"]
# Compat alias for consumers expecting nie-re-core/shenron-re wasm gating
wasm = ["dep:wasm-bindgen"]

[dependencies]
# Core workspace dependencies (all crates.io-backed)
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
goblin = "0.10.7"
iced-x86 = { version = "1.22.0", features = ["std", "decoder", "intel", "fast_fmt", "instr_info"] }
rustc-hash = "2.1.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
regex = "1.13.1"
crc32fast = { workspace = true }
zerocopy = { version = "0.8.63", features = ["derive", "alloc", "simd"] }
walkdir = "2.5.0"
flate2 = "1.1.11"
anyhow = { workspace = true }

# Standard crates.io RE libraries used by nie-re-core and nie-pe
aes = "0.9.4"
md5 = { package = "md-5", version = "0.11.0" }
hex = "0.4"
memchr = "2"
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
wasm-bindgen = { workspace = true, optional = true }

# Optional feature-gated dependencies
memmap2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
process-wrap = { version = "10.0.1", optional = true, default-features = false, features = ["std", "process-group", "job-object"] }
ghidra-decompiler = { version = "2.1.0", optional = true }
magika = { version = "1.1.0", optional = true }
# magika 1.1.0 pins ort =2.0.0-rc.12 (newest magika); it ships no ONNX Runtime backend: the final binary picks one. download-binaries fetches the prebuilt runtime at build time (host and msvc targets).
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["download-binaries", "tls-rustls"] }
rusty-leveldb = { version = "4", optional = true, default-features = false, features = ["fs"] }
yara-x = { version = "1.23.0", optional = true, default-features = false }

[lints]
workspace = true

# ort is magika's ONNX Runtime backend switch: selected through features, never named in code.
[package.metadata.cargo-shear]
ignored = ["ort"]
