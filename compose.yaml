# The one compose file of the monorepo: builds every image from the root Dockerfile (one target per
# service) and runs them. Production host: deploy/install.sh copies it to /srv/nie/deploy and
# nie-stack.service runs it with NIE_TAG from /etc/nie/stack.env (images pulled, never built there).
# Local: NIE_TAG=dev NIE_GAME_DIR=/path/to/ievr NIE_CACHE_ROOT=./var docker compose up --build
name: nie

x-nie: &nie
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [nie]
  environment:
    NIE_GAME_SOURCE: /game
  tmpfs: [/tmp]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8790/health | grep -q '\"vfsReady\":true'"]
    interval: 15s
    timeout: 5s
    start_period: 120s
    retries: 5

services:
  nie:
    <<: *nie
    image: ghcr.io/aphrody-labs/nie:${NIE_TAG:?NIE_TAG}
    build: {context: ., target: nie}
    ports: ["127.0.0.1:8796:8790"]
    volumes:
      - {type: bind, source: "${NIE_GAME_DIR:-/srv/nie/steam/steamapps/common/INAZUMA ELEVEN Victory Road}", target: /game, read_only: true}
      - ${NIE_CACHE_ROOT:-/srv/nie/cache}/nie:/var/lib/nie

  nie-model:
    <<: *nie
    image: ghcr.io/aphrody-labs/nie-model-serve:${NIE_TAG:?NIE_TAG}
    build: {context: ., target: nie-model-serve}
    ports: ["127.0.0.1:8797:8790"]
    volumes:
      - {type: bind, source: "${NIE_GAME_DIR:-/srv/nie/steam/steamapps/common/INAZUMA ELEVEN Victory Road}", target: /game, read_only: true}
      - ${NIE_CACHE_ROOT:-/srv/nie/cache}/nie-model:/var/lib/nie

networks:
  nie:
    name: nie
