[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"
opt-level = 0

[profile.test]
debug = 1
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# Browser builds: whole-program optimisation for wasm32-unknown-unknown; wasm-bindgen and wasm-opt run afterwards.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# Craft browser apps: smallest download; wasm-bindgen and wasm-opt -Oz run afterwards.
[profile.web-craft]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"
