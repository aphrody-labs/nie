[workspace]
resolver = "2"
exclude = ["third_party"]
members = [
  "crates/achillea-bot",
  "crates/achillea-core",
  "crates/achillea-store",
  "crates/azalee-app",
  "crates/nie-app",
  "crates/nie-bevy",
  "crates/nie-camera",
  "crates/nie-cfgsql",
  "crates/nie-cli",
  "crates/nie-computer-use",
  "crates/nie-core",
  "crates/nie-data",
  "crates/nie-explore",
  "crates/nie-ffi",
  "crates/nie-forge",
  "crates/nie-formats",
  "crates/nie-game",
  "crates/nie-headless",
  "crates/nie-index",
  "crates/nie-launcher",
  "crates/nie-lua",
  "crates/nie-model-serve",
  "crates/nie-net",
  "crates/nie-ocgen",
  "crates/nie-pe",
  "crates/nie-queue",
  "crates/nie-render3d",
  "crates/nie-runtime",
  "crates/nie-save",
  "crates/nie-seed",
  "crates/nie-sitemap",
  "crates/nie-sql",
  "crates/nie-trace",
  "crates/nie-ui",
  "crates/nie-ui-dioxus",
  "crates/rg-ffi",
  "crates/rg-ffi-contract",
  "crates/nie-viola",
  "crates/nie-wasm",
  "crates/nie-wiki",
  "crates/nie-zukan",
  "crates/nie-pkg",
  "crates/nie-gpu",
  "crates/rg-re",
  "crates/rg-steam",
  "crates/yolo-re-core",
  "tools/steam-index",
]

[workspace.package]
version = "1.4.7"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/rosegriffon"
homepage = "https://rosegriffon.fr"
authors = ["Rose Griffon contributors"]


[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.dependencies]

anyhow = { version = "1.0.104", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
libc = { version = "0.2.191", default-features = false }
png = { version = "0.18.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
redis = { version = "1.8.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
steamroom = "0.3.0"
steamroom-client = "0.3.0"
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
