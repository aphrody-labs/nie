calloop = { version = "0.14.5", default-features = false }
pixman = { version = "0.2.1", default-features = false }
smithay = { version = "0.7.0", default-features = false }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false }
wayland-protocols-wlr = { version = "0.3.12", default-features = false }

bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_asset = { version = "0.20.1", default-features = false }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_image = { version = "0.20.1", default-features = false, features = [
