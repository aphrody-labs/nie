[workspace]
resolver = "3"
members = ["crates/*", "tools/steam-index"]

[workspace.package]
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/nie"
authors = ["nie contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
libc = { version = "0.2.191", default-features = false }
png = { version = "0.18.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
redis = { version = "1.8.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
steamroom = "0.3.0"
steamroom-client = "0.3.0"
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }

bevy = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_asset = { version = "0.20.1", default-features = false }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_image = { version = "0.20.1", default-features = false, features = [
  "bevy_reflect",
] }
bevy_color = { version = "0.20.1", default-features = false }
bevy_math = { version = "0.20.1", default-features = false }
bevy_text = { version = "0.20.1", default-features = false }
bevy_ui = { version = "0.20.1", default-features = false }
bevy_mesh = { version = "0.20.1", default-features = false }
bevy_reflect = { version = "0.20.1", default-features = false }
bevy-wgpu-types = { package = "wgpu-types", version = "30.0.2", default-features = false }
rg-steam = { path = "crates/rg-steam", version = "1.4.8", default-features = false }
nie-gpu = { path = "crates/nie-gpu", version = "1.4.8" }
bytemuck = { version = "1.25", features = [
  "derive",
  "extern_crate_alloc",
  "min_const_generics",
] }
clap = { version = "4", features = ["derive", "env"] }
console_error_panic_hook = "0.1.7"
futures-lite = "2"
js-sys = { version = "0.3.107", default-features = false }
pollster = "1.0"
rusqlite = { version = "0.43" }
wasm-bindgen = { version = "0.2.130", default-features = false }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.107", default-features = false }
crc32fast = { version = "1.5", default-features = false }
nie-re-core = { path = "crates/nie-re-core", version = "1.4.8" }
image_dds = { version = "0.7", default-features = false }
memmap2 = { version = "0.9" }
nie-app = { default-features = false, path = "crates/nie-app", version = "1.4.8" }
nie-camera = { default-features = false, path = "crates/nie-camera", version = "1.4.8" }
nie-computer-use = { default-features = false, path = "crates/nie-computer-use", version = "1.4.8" }
nie-core = { default-features = false, path = "crates/nie-core", version = "1.4.8" }
nie-data = { path = "crates/nie-data", version = "1.4.8" }
nie-explore = { default-features = false, path = "crates/nie-explore", version = "1.4.8" }
nie-forge = { default-features = false, path = "crates/nie-forge", version = "1.4.8" }
nie-formats = { default-features = false, path = "crates/nie-formats", version = "1.4.8" }
nie-index = { default-features = false, path = "crates/nie-index", version = "1.4.8" }
nie-lua = { default-features = false, path = "crates/nie-lua", version = "1.4.8" }
nie-model-serve = { default-features = false, path = "crates/nie-model-serve", version = "1.4.8" }
nie-pe = { default-features = false, path = "crates/nie-pe", version = "1.4.8" }
nie-render3d = { default-features = false, path = "crates/nie-render3d", version = "1.4.8" }
nie-runtime = { default-features = false, path = "crates/nie-runtime", version = "1.4.8" }
nie-save = { default-features = false, path = "crates/nie-save", version = "1.4.8" }
nie-seed = { default-features = false, path = "crates/nie-seed", version = "1.4.8" }
nie-trace = { default-features = false, path = "crates/nie-trace", version = "1.4.8" }
nie-wiki = { path = "crates/nie-wiki", version = "1.4.8" }
nie-zukan = { default-features = false, path = "crates/nie-zukan", version = "1.4.8" }
nie-ui = { path = "crates/nie-ui", version = "1.4.8" }
# Same feature set as bevy_ui: taffy's default `float_layout`/`table` features add `Style` fields that bevy_ui
# does not initialise, and Cargo unifies features across the workspace.
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "block_layout", "flexbox", "grid", "content_size"] }
winnow = { version = "1.0.5", default-features = false, features = [
  "alloc",
  "parser",
] }
wana_kana = "5.0.0"
aho-corasick = "1.1.5"

toml = "1.2.1"
nie-net = { default-features = false, path = "crates/nie-net", version = "1.4.8" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"
opt-level = 0

[profile.test]
debug = 1
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"

# Browser builds: whole-program optimisation for wasm32-unknown-unknown; wasm-bindgen and wasm-opt run afterwards.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# Craft browser apps: smallest download; wasm-bindgen and wasm-opt -Oz run afterwards.
[profile.web-craft]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"
