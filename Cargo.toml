aho-corasick = "1.1.5"
# Terminal explorer (plugins/tui, crates/nie-explore feature `fm`): versions read live from crates.io on 2026-11-19.
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false }
nucleo = "0.5.0"
openh264 = { version = "0.9.10", default-features = false, features = ["source"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
tree-sitter-highlight = "0.27.2"
tree-sitter-lua = "0.5.0"
# Terminal window (`nie term`, crates/nie-explore feature `term`, plugins/tui feature `term`): rio 0.5.32 read live from index.crates.io on 2026-11-19.
rio-vt = { version = "0.5.32", default-features = false, features = ["graphics"] }
rio-graphics = { version = "0.5.32", default-features = false }
rio-window = { version = "0.5.32", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
sugarloaf = { version = "0.5.32", features = ["wgpu"] }

toml = "1.2.1"
semver = "1.0.28"
sctrace = "0.19.0"
regex = { version = "1.13.1", default-features = false }
ureq = { version = "3.5.1", default-features = false }
toml_edit = "0.25.19"
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
windows = { version = "0.62.2", default-features = false }
cranelift-codegen = "=0.137.1"
cranelift-frontend = "=0.137.1"
cranelift-jit = "=0.137.1"
cranelift-module = "=0.137.1"
cranelift-native = "=0.137.1"
cranelift-object = "=0.137.1"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
libc = "0.2.191"
libloading = "=0.9.0"
target-lexicon = "=0.13.5"

# steamroom 0.3.0 forces reqwest's default rustls provider (aws-lc). The fork branch nie/no-provider is
# v0.3.0 plus upstream 4dd310cb (selectable provider) with the provider left to the host (nie-tls).
# Drop this patch when steamroom publishes a release that carries that commit.
[patch.crates-io]

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"
opt-level = 0

[profile.test]
debug = 1
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"

# Browser builds: whole-program optimisation for wasm32-unknown-unknown; wasm-bindgen and wasm-opt run afterwards.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# Craft browser apps: smallest download; wasm-bindgen and wasm-opt -Oz run afterwards.
[profile.web-craft]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# The vendored PUC-Rio Lua 5.2 oracle of nie-lua (differential tests) is built optimised: its shift by a count
# of 2^31 is undefined in C and only the optimised build matches the stock x86 behaviour modelled in rt/bit32.rs.
[profile.dev.package.mlua-sys]
opt-level = 2

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"
