[workspace]
resolver = "3"
members = ["crates/*", "plugins/*/*", "apps/*", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/nie"
authors = ["nie contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
async-trait = "0.1.92"
bytes = { version = "1.12.2", default-features = false }
nix = { version = "0.31.4", default-features = false, features = ["signal", "user"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
pingora-cache = { version = "0.9.1", default-features = false, features = ["rustls"] }
pingora-core = { version = "0.9.1", default-features = false, features = ["rustls"] }
pingora-http = "0.9.1"
pingora-limits = "0.9.1"
pingora-load-balancing = { version = "0.9.1", default-features = false, features = ["rustls"] }
pingora-proxy = { version = "0.9.1", default-features = false, features = ["rustls"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.7" }
opendal = { version = "0.59.5", default-features = false, features = [
  "executors-tokio",
  "http-transport-reqwest-rustls-no-provider",
  "layers-retry",
  "services-gdrive",
  "services-http",
  "services-s3",
] }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, features = ["rustls-no-provider"] }
png = { version = "0.18.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
redis = { version = "1.8.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
russh = { version = "=0.65.2", default-features = false, features = ["aws-lc-rs", "rsa"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
graviola = "0.4.5"
nie-tls = { path = "crates/nie-tls", version = "2.0.0" }
nie-ssh = { path = "crates/nie-ssh", version = "2.0.0" }
russh-sftp = { version = "3.0.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
flate2 = "1.1.11"
corosensei = { version = "0.3.4", default-features = false, features = ["default-stack"] }
gix-hash = { version = "0.28.1", default-features = false, features = ["sha1"] }
gix-index = { version = "0.58.0", default-features = false, features = ["sha1"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
steamroom = { version = "0.3.0", default-features = false }
steamroom-client = { version = "0.3.0", default-features = false }
ssh2-config = "0.9.0"
syn = { version = "3.0.10", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
