[workspace]
resolver = "3"
members = ["crates/*", "plugins/*/*", "apps/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/nie"
authors = ["nie contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.7" }
opendal = { version = "0.59.5", default-features = false, features = [
  "executors-tokio",
  "http-transport-reqwest",
  "layers-retry",
  "services-gdrive",
  "services-http",
  "services-s3",
] }
png = { version = "0.18.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
redis = { version = "1.8.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
russh = { version = "=0.65.1", default-features = false, features = [
  "aws-lc-rs",
  "rsa",
] }
russh-sftp = { version = "3.0.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
steamroom = "0.3.0"
steamroom-client = "0.3.0"
ssh2-config = "0.9.0"
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }

bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_asset = { version = "0.20.1", default-features = false }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_image = { version = "0.20.1", default-features = false, features = [
  "bevy_reflect",
] }
bevy_math = { version = "0.20.1", default-features = false }
bevy_mesh = { version = "0.20.1", default-features = false }
bevy_reflect = { version = "0.20.1", default-features = false }
bevy-wgpu-types = { package = "wgpu-types", version = "30.0.2", default-features = false }
nie-steam = { path = "plugins/steam/nie-steam", version = "2.0.0", default-features = false }
nie-gpu = { path = "crates/nie-gpu", version = "2.0.0" }
clap = { version = "4", features = ["derive", "env"] }
console_error_panic_hook = "0.1.7"
futures-lite = "2"
rusqlite = { version = "0.43" }
wasm-bindgen = { version = "0.2.130", default-features = false }
crc32fast = { version = "1.5", default-features = false }
image_dds = { version = "0.7", default-features = false }
memmap2 = { version = "0.9" }
nie-data = { path = "crates/nie-data", version = "2.0.0" }
nie-explore = { default-features = false, path = "crates/nie-explore", version = "2.0.0" }
nie-formats = { default-features = false, path = "crates/nie-formats", version = "2.0.0" }
nie-index = { default-features = false, path = "plugins/exe/nie-index", version = "2.0.0" }
nie-lua = { default-features = false, path = "crates/nie-lua", version = "2.0.0" }
nie-plugin = { path = "crates/nie-plugin", version = "2.0.0" }
nie-pe = { default-features = false, path = "plugins/exe/nie-pe", version = "2.0.0" }
nie-save = { default-features = false, path = "plugins/save/nie-save", version = "2.0.0" }
winnow = { version = "1.0.5", default-features = false, features = [
  "alloc",
  "parser",
] }
wana_kana = "5.0.0"
specta = { version = "2.0.0-rc.28", features = ["derive", "serde_json"] }
aho-corasick = "1.1.5"

toml = "1.2.1"
regex = { version = "1.13.1", default-features = false }
sctrace = "0.19.0"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"
opt-level = 0

[profile.test]
debug = 1
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"

# Browser builds: whole-program optimisation for wasm32-unknown-unknown; wasm-bindgen and wasm-opt run afterwards.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# Craft browser apps: smallest download; wasm-bindgen and wasm-opt -Oz run afterwards.
[profile.web-craft]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"
