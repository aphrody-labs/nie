# SPDX-License-Identifier: Apache-2.0
# Rust/Bevy WASM apps: static bundles under /data/cdn/apps/<name> (services.toml achillea-rs, azalee-rs).
# 503 until a bundle (index.html) is published. Hashed assets are immutable.

types { application/wasm wasm; }

server {
    listen 8080;
    server_name ${RG_VHOSTS:achillea-rs};
    root /data/cdn/apps/achillea-rs;
    index index.html;
    location ~* "\.[0-9a-f]{8,}\.(?:js|mjs|css|wasm|woff2?|png|jpe?g|webp|avif|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
    location / {
        if (!-f $document_root/index.html) { return 503; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
}

server {
    listen 8080;
    server_name ${RG_VHOSTS:azalee-rs};
    root /data/cdn/apps/azalee-rs;
    index index.html;
    location ~* "\.[0-9a-f]{8,}\.(?:js|mjs|css|wasm|woff2?|png|jpe?g|webp|avif|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
    location / {
        if (!-f $document_root/index.html) { return 503; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
}
