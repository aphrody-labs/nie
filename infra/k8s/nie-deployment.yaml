apiVersion: apps/v1
kind: Deployment
metadata:
  name: nie
  namespace: rosegriffon-nie
  labels:
    app.kubernetes.io/name: nie
    app.kubernetes.io/part-of: rosegriffon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nie
        app.kubernetes.io/part-of: rosegriffon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nie
          image: ghcr.io/rosegriffon/nie:latest
          imagePullPolicy: IfNotPresent
          args:
            - "sh"
            - "-c"
            - 'exec nie serve --host "${NIE_HOST:-0.0.0.0}" --port "${NIE_PORT:-8790}" --stateless'
          ports:
            - name: http
              containerPort: 8790
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nie-config
            - secretRef:
                name: nie-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nie
            - name: work
              mountPath: /srv/nie
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: work
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
