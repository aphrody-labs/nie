apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serve
  namespace: rosegriffon-nie
  labels:
    app.kubernetes.io/name: model-serve
    app.kubernetes.io/part-of: rosegriffon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-serve
        app.kubernetes.io/part-of: rosegriffon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: model-serve
          image: ghcr.io/rosegriffon/model-serve:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8792
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nie-config
            - secretRef:
                name: nie-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 10Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /var/cache/nie-model-serve
            - name: work
              mountPath: /srv/nie
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-serve-cache-pvc
        - name: work
          persistentVolumeClaim:
            claimName: nie-cache-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
