# Copy to secret.yaml (never commit real credentials) and apply manually or via ExternalSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: nie-secrets
  namespace: rosegriffon-nie
type: Opaque
stringData:
  NIE_RAW_VFS_TOKEN: "replace-with-random-bearer-token"
  RCLONE_CONFIG_R2_TYPE: "s3"
  RCLONE_CONFIG_R2_PROVIDER: "Cloudflare"
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: "replace-with-r2-access-key-id"
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "replace-with-r2-secret-access-key"
  RCLONE_CONFIG_R2_ENDPOINT: "https://replace-with-account-id.r2.cloudflarestorage.com"
  RCLONE_CONFIG_R2_ACL: "private"
  R2_ACCESS_KEY_ID: "replace-with-r2-access-key-id"
  R2_SECRET_ACCESS_KEY: "replace-with-r2-secret-access-key"
  R2_ENDPOINT: "https://replace-with-account-id.r2.cloudflarestorage.com"
