[package]
name = "nie-sql"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE.upstream"
publish = false
description = "Shared bounded read-only SQLite and PostgreSQL boundary for NIE hosts"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[features]
crlib = []

[dependencies]
bytes = "1.12.1"
rusqlite = { workspace = true, features = ["bundled", "column_decltype"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tokio-postgres = { version = "0.7", default-features = false, features = [
  "runtime",
  "with-serde_json-1",
] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["native-certs"] }
nie-tls = { workspace = true }

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
