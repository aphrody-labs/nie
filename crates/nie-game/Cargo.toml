[package]
name = "nie-game"
description = "Hôte GUI natif wgpu — rend les vrais assets IEVR (pilier D1/C4 pixel-perfect)"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "nie-game"
path = "src/main.rs"

[dependencies]
# Feature `textures` = décodeur G4TX/DDS → RGBA8/PNG partagé (`nie_formats::g4tx_decode`).
nie-formats = { workspace = true, features = ["textures"], default-features = true }
# VM Lua 5.2 réelle : exécute les vrais scripts de menu du jeu pour générer le layout au runtime
# (driver reversé OnInit/OnSetupLayer/OnOpenLayer → MenuState), comme nie.exe. API safe seulement.
nie-lua = { workspace = true, default-features = true, features = [
  "host",
] }
# Modèles de données + résolveur de texte universel : résout les libellés STATIQUES de menu
# (`TextComponent.hashes` → `menu_text`) pour l'export de layout (cf. DESIGN.md §7).
nie-data.workspace = true
# Le CŒUR du jeu : machine à états d'écrans (`flow::Screen`), rendu abstrait et police. `--play`
# se contente de la brancher sur une fenêtre — même FSM que le front web, aucune réimplémentation.
nie-app.workspace = true
# Atteint jusqu'ici transitivement par `nie-app::flow::Screen::Match`, alors que l'hôte utilise
# désormais sa cadence (`TICK_DT`) et son accumulateur (`FixedStep`) directement : une
# dépendance qu'on nomme est une dépendance qu'on peut voir.
nie-runtime.workspace = true
# Le type `Model` traverse l'API de `nie_app::match3d` (vue 3D du match) : nommable ici.
nie-render3d.workspace = true
nie-bevy = { path = "../nie-bevy", version = "1.4.8", features = ["bevy"] }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "color", "env"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
nie-gpu = { workspace = true }
# The feature set of the former root `bevy` pin; the root `bevy` pin is minimal ("std").
bevy = { workspace = true, features = [
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_image",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "x11",
  "wayland",
] }
pollster.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
# Encodage PNG des captures/exports (le décodage DDS/BCn est passé dans nie-formats).
png = { workspace = true }
# Export du layout de menu (JSON contrat `menu-render` pour azalee).
serde_json = { workspace = true }

[dev-dependencies]
rayon = { workspace = true }
# Example `dump_g4tx` + test `menu_render_gate` réfèrent les variantes `ImageFormat` en direct
# (le décodage applicatif passe par nie_formats::g4tx_decode, mais ces cibles de dev nomment l'enum).
image_dds.workspace = true
libc = { workspace = true }
memmap2.workspace = true
