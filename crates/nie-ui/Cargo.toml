[package]
name = "nie-ui"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Typed design tokens and native UI constants for Inazuma Eleven: Victory Road"

[lints]
workspace = true

[dependencies]
nie-formats = { path = "../nie-formats", version = "1.4.8", features = ["serde"] }
png = { version = "0.18.1", default-features = false }
serde_json = "1.0.154"
taffy = { workspace = true }

[[bin]]
name = "game_screens_css"
path = "src/bin/game_screens_css.rs"

