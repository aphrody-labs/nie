[package]
name = "nie-render"
description = "Bevy 3D rendering of a nie match: pitch, goals, players, ball, camera and scoreboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Browser build: wgpu on WebGPU (wasm32-unknown-unknown).
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { workspace = true, features = ["3d", "ui"] }
nie-craft.workspace = true
nie-model.workspace = true
nie-sim.workspace = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
