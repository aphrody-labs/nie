[package]
name = "nie-wasm"
description = "Bindings WebAssembly pour le savoir nie vérifié : nie-formats (detect/CRILAYLA/@UTF/G4*), nie-core (stats growth + FSM de match) et nie-data (lookup skill/aura/item) exposés au navigateur via wasm-bindgen"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

# cdylib pour wasm-bindgen ; rlib pour que `cargo build --workspace` (natif) reste vert.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Features : `textures` = décodeur G4TX/DDS partagé (`nie_formats::g4tx_decode`) ;
# `audio-decode` = décodeur audio HCA/ADX/AWB/ACB partagé (`cri_audio::decode_to_wav`).
# `image_dds`/`png`/`cridecoder` arrivent transitivement (pur Rust, compatibles wasm32).
nie-formats = { workspace = true, features = ["serde", "textures", "audio-decode"], default-features = true }
# nie-core (calcul de stats/growth + machine à états de match) et nie-data (lookup
# skill/aura/item) avec la feature `serde` pour sérialiser les résultats en JSON côté
# navigateur. Déclarés en path direct : ces deux crates ne sont pas (encore) dans la
# `[workspace.dependencies]` racine.
nie-core = { workspace = true, features = ["serde", "data"] }
nie-data = { workspace = true, features = ["serde"] }
nie-save = { workspace = true, features = ["serde"] }
# Le rendu 3D des VRAIS modèles du jeu. `default-features = false` retire `clap` (l'exécutable)
# et laisse le rastériseur CPU pur Rust : aucun GPU requis, et c'est exactement le code dont les
# tests golden natifs vérifient la sortie.
nie-render3d.workspace = true
# Decodeur de bytecode Lua 5.2 SANS la VM : `default-features = false` retire mlua (Lua
# vendored en C), qui ne se construit pas pour wasm32. Le module `bytecode` est pur Rust.
nie-lua = { workspace = true, default-features = false }
# nie-app : le JEU jouable (FSM GameState + rendu CPU framebuffer). Cœur wasm-safe
# (l'I/O assets est gatée hors wasm) → expose `WasmGame` pour le canvas navigateur.
nie-app.workspace = true
# Compositeur de scènes VFS, fenêtre EAC, glyphes de manette et HUD de match du client plein écran.
nie-ui.workspace = true
# `nie-runtime` provides the deterministic local match simulation and top-down renderer exposed by
# `WasmMatch`; it is not the native executable's match engine. `nie-render3d` follows separately.
nie-runtime.workspace = true
# Camera state, projection/view matrices and the verified interpolation controller are pure
# Rust. Host process memory and SQLite tooling stay excluded from the browser dependency graph.
nie-camera = { workspace = true, default-features = false }
# Shared VFS content dispatcher. Native filesystem search and the Lua VM remain behind
# nie-explore's disabled `host` feature; browser bytes use the same portable parsers as the CLI.
nie-explore = { workspace = true, default-features = false }
# Byte-exact executable comparison from the PE forge, without its optional serde surface.
nie-pe.workspace = true
# Bounded x86-64 lifting and blocker diagnostics from the executable forge. Database-backed
# reference storage stays outside the browser through the disabled `redb` feature.
nie-forge = { workspace = true, default-features = false }
# Single RE core (bun-re): safe in-memory minidump parsing (the browser wrapper exposes metadata
# only and never copies captured process memory back into JavaScript) and portable `.pdata`
# inspection. The `nie` feature (SQLite, filesystem) stays disabled.
yolo-re-core.workspace = true
# Credential-free Steam depot selection/collision planning; the `depot` client feature (network,
# token cache) stays disabled.
rg-steam = { workspace = true }
bevy_app = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
nie-bevy = { path = "../nie-bevy", version = "1.4.7", optional = true }
# Portable AOB scanning only; live process memory and patching remain behind the host feature.
nie-trace = { workspace = true, default-features = false }
# Pure official-encyclopedia matching; network, SQLite and CLI dependencies stay host-only.
nie-zukan = { workspace = true, default-features = false }
# Validated format-catalog parsing; database/path ingestion remains behind the host feature.
nie-seed = { workspace = true, default-features = false }
# Bounded offline image address/range inspection; process, SQLite and network probes stay host-only.
nie-computer-use = { workspace = true, default-features = false }
# Deterministic search over caller-owned reverse-engineering knowledge; SQLite and Redis stay host-only.
nie-index = { workspace = true, default-features = false }
# Bounded T2B character/model catalogs extracted from the HTTP binding.
nie-model-serve = { workspace = true, default-features = false }
# Online multiplayer protocol, Inacode validation, and deterministic rollback simulation.
nie-net = { workspace = true, default-features = false }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
# (cridecoder arrive via nie-formats feature `audio-decode` — plus de dép directe)

# wasm-bindgen est épinglé à une version EXACTE dans le Cargo.toml racine : le CLI
# `wasm-bindgen` doit porter la même, sinon les bindings générés sont rejetés.
# Gate via cfg(target_arch = "wasm32") dans le code source.
wasm-bindgen.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }
# GPU presentation (feature `webgpu`): wgpu through the shared backend, instance bytes.
nie-gpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }


# Browser entropy support for transitive getrandom 0.3 consumers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
getrandom = { version = "0.3.4", default-features = false, features = [
  "wasm_js",
] }
getrandom_02 = { package = "getrandom", version = "0.2.17", default-features = false, features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", default-features = false, features = ["wasm_js"] }
web-sys = { workspace = true, optional = true, features = [
  "HtmlCanvasElement",
  "Element",
  "HtmlElement",
  "Window",
  "Document",
  "Location",
  "Navigator",
  "Gamepad",
  "GamepadButton",
  "Performance",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "console",
] }
js-sys = { workspace = true, optional = true }

[features]
default = []
# Présentation WebGPU du viewport 3D. Le rastériseur CPU, lui, n'est derrière AUCUNE feature :
# c'est le seul rendu 3D qu'un moteur sans WebGPU puisse faire, et c'est celui dont la sortie
# est vérifiée par les tests golden natifs de `nie-render3d`.
# Rust-owned GPU presentation of the client (`gpu_client::NieGpuClient`): wgpu surface on the
# canvas, instanced UI quads, GPU match scene, rAF loop and input in wasm.
webgpu = [
  "nie-render3d/webgpu",
  "dep:nie-gpu",
  "dep:bytemuck",
  "dep:anyhow",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:js-sys",
]
# CPU frame path (`NieClientRuntime::render_into`, RGBA8 buffer): golden tests and headless
# captures only; the browser presents through `webgpu`.
cpu-frame = []
# WebGL2 fallback when the browser has no WebGPU (+~2 MiB).
webgl = ["webgpu", "nie-render3d/webgl"]
# Bevy 0.20.1 ECS/App/Asset plugin integration for browser targets.
bevy = [
  "dep:bevy_app",
  "dep:bevy_asset",
  "dep:bevy_ecs",
  "nie-bevy",
  "nie-bevy/bevy",
  "nie-render3d/bevy",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.cargo-machete]
ignored = ["getrandom"]
