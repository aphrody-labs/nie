[package]
name = "nie-wasm"
description = "WebAssembly bindings for the nie format readers (detect, CRILAYLA, @UTF, G4*, cfg.bin) and the nie-data and nie-explore decoders, exposed to the browser through wasm-bindgen"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = true
repository.workspace = true
rust-version.workspace = true

# cdylib pour wasm-bindgen ; rlib pour que `cargo build --workspace` (natif) reste vert.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Features : `textures` = décodeur G4TX/DDS partagé (`nie_formats::g4tx_decode`) ;
# `audio-decode` = décodeur audio HCA/ADX/AWB/ACB partagé (`cri_audio::decode_to_wav`).
# `image_dds`/`png`/`cridecoder` arrivent transitivement (pur Rust, compatibles wasm32).
nie-formats = { workspace = true, features = ["serde", "textures", "audio-decode"], default-features = true }
# nie-data (lookup skill/aura/item) avec la feature `serde` pour sérialiser les résultats en JSON
# côté navigateur.
nie-data = { workspace = true, features = ["serde"] }
# Shared VFS content dispatcher. Native filesystem search and the Lua VM remain behind
# nie-explore's disabled `host` feature; browser bytes use the same portable parsers as the CLI.
nie-explore = { workspace = true, default-features = false }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }

[features]
default = []
# `ModelViewer`: the WebGPU canvas presenter of nie-render3d. `webgl` adds its WebGL2 fallback.
webgpu = ["dep:nie-render3d", "nie-render3d/webgpu"]
webgl = ["webgpu", "nie-render3d/webgl"]

# The browser mount of the installation (`GameMount`) and its transports, then the browser
# entropy support for transitive getrandom 0.3 consumers.
# wasm-bindgen est épinglé à une version EXACTE dans le Cargo.toml racine : le CLI
# `wasm-bindgen` doit porter la même, sinon les bindings générés sont rejetés.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
blake3 = { workspace = true }
js-sys = { workspace = true }
nie-render3d = { path = "../nie-render3d", version = "2.0.0", default-features = false, optional = true }
nie-wiki-vfs = { path = "../nie-wiki-vfs", version = "2.0.0" }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "Blob",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "Headers",
  "HtmlCanvasElement",
  "Request",
  "RequestInit",
  "Response",
  "WorkerGlobalScope",
] }
console_error_panic_hook.workspace = true
getrandom = { version = "0.3.4", default-features = false, features = [
  "wasm_js",
] }
getrandom_02 = { package = "getrandom", version = "0.2.17", default-features = false, features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", default-features = false, features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Feature switches only: enable the browser entropy backend of every getrandom major in the graph.
[package.metadata.cargo-machete]
ignored = ["getrandom", "getrandom_02", "getrandom_04"]

[package.metadata.cargo-shear]
ignored = ["getrandom_04"]
