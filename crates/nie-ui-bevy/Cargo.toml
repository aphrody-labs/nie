[package]
name = "nie-ui-bevy"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Spawns the shared UiNode tree (built from VFS data) as Bevy UI entities"

[lints]
workspace = true

[dependencies]
bevy_color = { version = "=0.20.0-dev", default-features = false }
bevy_ecs = { workspace = true }
bevy_text = { version = "=0.20.0-dev", default-features = false }
bevy_ui = { version = "=0.20.0-dev", default-features = false }
nie-ui-dioxus = { path = "../nie-ui-dioxus", version = "1.4.8", default-features = false }
