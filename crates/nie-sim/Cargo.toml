[package]
name = "nie-sim"
description = "Deterministic 5v5 football match simulation as a Bevy ECS plugin, runnable headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bevy_app = { workspace = true, features = ["std"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_math = { workspace = true, features = ["std"] }
nie-ai.workspace = true
nie-input.workspace = true
nie-model.workspace = true
nie-physics.workspace = true
serde.workspace = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
nie-lockstep.workspace = true
