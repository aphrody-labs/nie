[package]
name = "nie-studio"
description = "Native GUI manager and editor for nie game manifests, with a built-in headless match simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap.workspace = true
eframe = { workspace = true, features = ["glow", "default_fonts", "x11", "wayland"] }
nie-craft.workspace = true
nie-model.workspace = true
nie-sim.workspace = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
