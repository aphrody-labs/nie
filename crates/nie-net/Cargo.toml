[package]
name = "nie-net"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false
description = "IEVR online lobby, room and deterministic multiplayer session state"

[lints]
workspace = true

[features]
default = ["transport"]
transport = [
  "dep:tokio",
  "dep:futures-util",
  "dep:tokio-tungstenite",
  "dep:uuid",
  "dep:anyhow",
]

[dependencies]
nie-runtime = { path = "../nie-runtime", version = "1.4.8", default-features = false }
nie-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
uuid = { version = "1.29.2", features = ["v4"], optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
