[package]
name = "nie-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Edge proxy of nie.aphrody.app on the pingora crates: routing, limits, cache, health and Cloudflare origin TLS."

[lints]
workspace = true

[[bin]]
name = "nie-edge"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi", "tracing-log", "std"] }

[target.'cfg(unix)'.dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
nix = { workspace = true }
pingora-cache = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
pingora-limits = { workspace = true }
pingora-load-balancing = { workspace = true }
pingora-proxy = { workspace = true }

[dev-dependencies]
nie-model-serve = { path = "../nie-model-serve", version = "2.0.0", default-features = false }
