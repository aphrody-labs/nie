[package]
name = "nie-explore"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false
description = "Format-aware VFS and game asset reverse-engineering summaries for Inazuma Eleven"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[features]
crlib = []
default = ["host"]
host = [
  "dep:anyhow",
  "dep:base64",
  "dep:globset",
  "dep:grep-regex",
  "dep:grep-searcher",
  "dep:ignore",
  "dep:specta",
]

# The renderer-independent view model of the terminal explorer (`nie fm`) and of the GPUI twin:
# VFS tree, keymap, fuzzy search, previews and the BLAKE3 thumbnail cache.
fm = [
  "host",
  "dep:blake3",
  "dep:dirs",
  "dep:globset",
  "dep:nucleo",
  "dep:png",
  "dep:toml",
  "dep:tree-sitter-highlight",
  "dep:tree-sitter-lua",
]
# The renderer-independent model of the terminal window (`nie term`): the rio-vt VT core, with the
# input encoders. Portable: no window system, GPU API or pty.
term = ["dep:rio-vt", "dep:rio-graphics"]
# A generated game for the tests of the explorer.
fm-fixture = ["fm", "dep:tempfile"]
# H.264 frames of the USM films (OpenH264 built from source).
fm-video = ["fm", "dep:openh264"]
# Turntable of G4MD models through the CPU rasteriser of nie-render3d.
fm-model = ["fm", "dep:nie-render3d"]

[dependencies]
blake3 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
nucleo = { workspace = true, optional = true }
openh264 = { workspace = true, optional = true }
png = { workspace = true, optional = true }
rio-graphics = { workspace = true, optional = true }
rio-vt = { workspace = true, optional = true }
toml = { workspace = true, features = ["parse", "serde", "std"], optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
nie-render3d = { path = "../nie-render3d", version = "2.0.0", default-features = false, optional = true }
nie-formats = { path = "../nie-formats", version = "2.0.0", default-features = false, features = ["std", "serde", "lua", "textures", "images", "audio-decode"] }
nie-lua = { path = "../nie-lua", version = "2.0.0" }
nie-data = { path = "../nie-data", version = "2.0.0", features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["std", "derive"] }
serde_json = { version = "1.0.154", features = ["std"] }
anyhow = { version = "1.0.104", optional = true }
base64 = { version = "0.23.1", optional = true }
globset = { version = "0.4", optional = true }
grep-regex = { version = "0.1", optional = true }
grep-searcher = { version = "0.1", optional = true }
ignore = { version = "0.4", optional = true }
specta = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
