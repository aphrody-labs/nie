[package]
name = "nie-ocgen"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false
description = "Static mod-authoring pipeline for IEVR avatar parameters and portrait assets"

[lints]
workspace = true

[dependencies]
nie-data = { workspace = true, features = ["serde", "std"] }
nie-formats = { workspace = true, default-features = false, features = [
  "std",
  "textures",
] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
clap = { version = "4.6", features = ["derive"], optional = true }

[features]
default = []
cli = ["dep:clap"]
bc7 = ["nie-formats/textures-encode"]

[[bin]]
name = "nie-ocgen"
path = "src/main.rs"
required-features = ["cli"]
