[package]
name = "nie-cfgsql"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Exact cfg.bin (RDBN and T2B) to SQL schema and rows for Postgres and SQLite, generated from the VFS"

[lints]
workspace = true

[dependencies]
nie-formats = { workspace = true, features = ["std", "serde"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
