# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-re-core"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://rosegriffon.fr"
repository = "https://github.com/aphrody-labs/rosegriffon"
keywords = ["reverse-engineering", "pe64", "disassembly", "dbxv2", "rosegriffon"]
categories = ["development-tools::debugging", "parser-implementations"]
description = "Consolidated reverse engineering core (façade over rg-re): PE/ELF/Mach-O triage, strings, x86-64 disassembly, ASAR/Electron/Go/Adobe/Android/SteamStub/minidump inspection, AOB scanning, live memory recovery."

[lib]
name = "bun_re"
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[features]
default = ["pipeline", "game-formats"]
assets = [
  "game-formats",
  "dep:rusqlite",
  "dep:lz4_flex",
  "dep:cridecoder",
  "nie-formats/textures",
  "nie-formats/images",
]
dbxv2 = ["assets", "dep:rusqlite"]
nie = [
  "dep:nie-index",
  "nie-index/host",
  "dep:anyhow",
  "dep:tracing",
]
decompile = ["rg-re/decompile"]
game-formats = [
  "dep:nie-formats",
  "nie-formats/std",
  "nie-formats/serde",
  "nie-formats/audio-decode",
  "nie-formats/lua",
]
wasm = [
  "game-formats",
  "rg-re/wasm",
  "dep:wasm-bindgen",
  "dep:serde-wasm-bindgen",
  "dep:js-sys",
  "nie-formats/textures",
  "nie-formats/images",
]
pipeline = ["rg-re/pipeline", "dep:tempfile", "dep:process-wrap"]
magika = ["rg-re/magika"]
leveldb = ["rg-re/leveldb", "dep:tempfile"]
yara = ["rg-re/yara"]
worker = ["dep:anyhow", "dep:redis"]

[dependencies]
rg-re = { path = "../rg-re", version = "1.4.8", default-features = false, features = ["game"] }
rg-steam = { workspace = true }
nie-index = { workspace = true, optional = true }
nie-formats = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
cridecoder = { workspace = true, optional = true }
goblin = { version = "0.10", default-features = false, features = [
  "std",
  "endian_fd",
  "pe32",
  "pe64",
  "elf32",
  "elf64",
  "mach32",
  "mach64",
] }
sha2 = "0.11.1"
aes = "0.9.4"
flate2 = "1.1.11"
lzma-rs = "0.3"
crc32fast = { workspace = true }
hex = "0.4"
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = "1.0.154"
thiserror = "2.0.21"
iced-x86 = "1.22"
tempfile = { version = "3.27.0", optional = true }
walkdir = "2.5.0"
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
process-wrap = { version = "10.0.1", optional = true, default-features = false, features = ["std", "process-group", "job-object"] }
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
js-sys = { workspace = true, optional = true }
redis = { version = "1.8.2", features = ["streams"], optional = true }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bin]]
name = "bunre"
path = "src/bin/bunre/main.rs"

[[bin]]
name = "yre-worker"
path = "src/bin/yre-worker.rs"
required-features = ["worker"]

[[example]]
name = "dump_census"

[[example]]
name = "dump_scan"

[[bench]]
name = "triage"
harness = false
