[package]
name = "nie-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Language bindings generated from one C ABI contract: C, C++, Rust, Python, C#, Go, Bun and Zig"

[lints]
workspace = true

[lib]
name = "nie_bindgen"

[[bin]]
name = "nie-bindgen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true }
nie-abi = { path = "../nie-abi", version = "2.0.0" }
serde_json = { workspace = true, features = ["std"] }
