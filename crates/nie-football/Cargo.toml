[package]
name = "nie-football"
description = "Native 3D football game on Bevy: plays a nie manifest in a window or headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Browser build (`bevy_web` frontend): wgpu on WebGPU, for wasm32-unknown-unknown.
webgpu = ["nie-render/webgpu"]

[dependencies]
bevy = { workspace = true, features = ["3d", "ui"] }
nie-craft.workspace = true
nie-input.workspace = true
nie-model.workspace = true
nie-render.workspace = true
nie-sim.workspace = true

# The browser has no command line and no file system: the manifest is compiled in (see `main`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
