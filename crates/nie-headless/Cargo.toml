[package]
name = "nie-headless"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE.upstream"
publish = false
description = "Host-side CLI for inspecting IE/IEVR formats and deterministic game data"

[lints]
workspace = true

[features]
default = ["host"]
host = [
  "dep:clap",
  "dep:nie-core",
  "dep:nie-data",
  "dep:nie-save",
  "dep:yolo-re-core",
  "dep:nie-render3d",
  "nie-render3d/video",
  "dep:png",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
nie-formats = { workspace = true, default-features = true }
nie-data = { workspace = true, optional = true }
nie-core = { workspace = true, optional = true }
nie-save = { path = "../nie-save", optional = true }
yolo-re-core = { workspace = true, default-features = false, optional = true }
nie-render3d = { workspace = true, default-features = false, optional = true }
png = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = [
  "derive",
  "color",
  "env",
] }
nie-app = { path = "../nie-app", version = "1.4.8" }
nie-runtime = { path = "../nie-runtime", version = "1.4.8" }

[[bin]]
name = "nie-headless"
path = "src/main.rs"
required-features = ["host"]
