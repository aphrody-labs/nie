[package]
name = "nie-pe"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/rosegriffon"
homepage = "https://rosegriffon.fr"
description = "Byte-exact PE64 model, complete image partitioning, rebuild and COFF object inspection for Inazuma Eleven RE (backed by rg-re)"
keywords = ["pe", "reverse-engineering", "coff", "assembler", "x86-64"]
categories = ["development-tools::debugging", "parser-implementations"]

[lints]
workspace = true

[features]
default = ["serde"]
serde = []

[dependencies]
rg-re = { path = "../rg-re", version = "1.4.8", default-features = false }
