[package]
name = "nie-ui-tree"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Data-driven UI tree (built from VFS data), taffy layout and plain HTML renderer shared by Azalee, Achillea and nie"

[lints]
workspace = true

[dependencies]
nie-cfgsql = { path = "../nie-cfgsql", version = "1.4.8" }
taffy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
nie-formats = { workspace = true, features = ["std", "serde"] }
