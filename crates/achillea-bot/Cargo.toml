[package]
name = "achillea-bot"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Achillea Discord bot (serenity + poise): ranked score reports, ladder, clans, Ultimate Team packs"

[lints]
workspace = true

[[bin]]
name = "achillea-bot"
path = "src/main.rs"

[dependencies]
achillea-core = { path = "../achillea-core", version = "1.4.8" }
achillea-store = { path = "../achillea-store", version = "1.4.8" }
poise = "0.7.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
