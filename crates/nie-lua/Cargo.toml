[package]
name = "nie-lua"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Lua 5.2 bytecode inspection, host runtime and analysis for Inazuma Eleven"

[lints]
workspace = true

[features]
default = []
host = ["vm", "analysis"]
vm = ["dep:mlua"]
aot = [
  "dep:corosensei",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-jit",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:cranelift-object",
]
analysis = ["dep:tree-sitter", "dep:tree-sitter-lua"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
mlua = { version = "0.12", optional = true, features = ["lua52", "vendored"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
corosensei = { workspace = true, optional = true }
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }

# Tests and examples read real menu cfg.bin / VFS files. No `lua` feature on nie-formats:
# it would depend back on this crate.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
nie-formats = { workspace = true, features = ["std"] }
nie-data = { workspace = true }
serde_json = { workspace = true }
libloading = { workspace = true }

[[test]]
name = "aot_diff"
required-features = ["aot", "vm"]

[[test]]
name = "aot_object"
required-features = ["aot", "vm"]

[[test]]
name = "lstr_oracle"
required-features = ["vm"]

[[test]]
name = "main_menu_inc"
required-features = ["vm"]

[[test]]
name = "menu_host_gap"
required-features = ["vm"]

[[test]]
name = "opcode_survey"
required-features = ["vm"]

[[example]]
name = "aot_corpus"
required-features = ["aot", "vm"]

[[example]]
name = "couverture_funclua"
required-features = ["vm"]

[[example]]
name = "probe_menu_script"
required-features = ["vm"]
