[package]
name = "rg-ffi-contract"
version = "1.4.8"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "One contract (JSON) for the Rust/Bun FFI: generates the C header, the Rust extern layer, the bun:ffi binding and the OpenAPI document"

[lints]
workspace = true

[lib]
name = "rg_ffi_contract"

[[bin]]
name = "rg-ffi-gen"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
