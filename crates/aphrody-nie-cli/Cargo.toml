[package]
name = "aphrody-nie-cli"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Native host CLI for Inazuma Eleven reverse engineering and game data"
autobins = false

[[bin]]
name = "nie"
path = "src/bin.rs"
required-features = ["cloud"]

[[bin]]
name = "aphrody-nie-mcp"
path = "src/bin/aphrody-nie-mcp.rs"
required-features = ["host"]

[[bin]]
name = "aphrody-nie-play"
path = "src/bin/aphrody-nie-play.rs"
required-features = ["host"]

[lib]
path = "src/main.rs"

[package.metadata.aphrody-package]
binary = "nie"
install-package = "aphrody-nie-cli"
supported-os = ["linux", "macos", "windows"]

[lints]
workspace = true

[features]
default = ["host"]
# Self-hosted, pure-Rust cloud profile (Docker / Kubernetes / static musl): zero C++ ISPC, zero Lua C, zero desktop RE.
cloud = [
  "dep:bun-steam",
  "dep:aphrody-nie-data",
  "dep:aphrody-nie-formats",
  "dep:aphrody-nie-explore",
  "dep:aphrody-nie-net",
  "dep:tokio",
  "dep:futures-util",
  "dep:tokio-tungstenite",
  "dep:reqwest",
  "dep:aphrody-nie-save",
  "dep:aphrody-nie-app",
  "dep:aphrody-nie-core",
  "dep:aphrody-nie-render3d",
  "dep:clap",
  "dep:anyhow",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:sha2",
  "dep:sha1",
  "dep:steamroom",
  "dep:zip",
  "dep:hex",
  "dep:base64",
  "dep:serde",
  "dep:serde_json",
  "dep:rayon",
  "dep:image_dds",
  "dep:image",
  "dep:png",
]
host = [
  "cloud",
  "aphrody-nie-formats/lua",
  "dep:aphrody-nie-index",
  "dep:aphrody-nie-seed",
  "dep:aphrody-nie-queue",
  "dep:aphrody-re",
  "dep:aphrody-nie-trace",
  "dep:aphrody-nie-computer-use",
  "dep:aphrody-nie-viola",
  "dep:aphrody-nie-launcher",
  "dep:aphrody-nie-lua",
  "dep:aphrody-nie-wiki",
  "dep:aphrody-nie-zukan",
  "dep:aphrody-nie-runtime",
  "dep:aphrody-nie-ocgen",
  "dep:redis",
  "dep:schemars",
  "dep:rmcp",
  "dep:goblin",
  "dep:iced-x86",
  "dep:ignore",
  "dep:globset",
  "dep:grep-searcher",
  "dep:grep-regex",
  "dep:rusqlite",
]
textures-encode = ["host", "aphrody-nie-formats/textures-encode"]

[dependencies]
aphrody-nie-data = { path = "../aphrody-nie-data", version = "1.4.8", features = ["serde", "std"], optional = true }
aphrody-nie-formats = { path = "../aphrody-nie-formats", version = "1.4.8", default-features = false, features = ["std", "serde", "textures", "audio-decode", "images", "remote-vfs"], optional = true }
aphrody-nie-explore = { path = "../aphrody-nie-explore", version = "1.4.8", features = ["host"], optional = true }
aphrody-nie-net = { path = "../aphrody-nie-net", version = "1.4.8", features = ["transport"], optional = true }
futures-util = { version = "0.3", optional = true }
aphrody-nie-save = { path = "../aphrody-nie-save", version = "1.4.8", optional = true }
aphrody-nie-app = { path = "../aphrody-nie-app", version = "1.4.8", optional = true }
aphrody-nie-core = { path = "../aphrody-nie-core", version = "1.4.8", optional = true }
aphrody-nie-runtime = { path = "../aphrody-nie-runtime", version = "1.4.8", default-features = false, optional = true }
aphrody-nie-render3d = { path = "../aphrody-nie-render3d", version = "1.4.8", default-features = false, optional = true }
clap = { workspace = true, features = ["color"], optional = true }
anyhow = { workspace = true, features = ["std"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi", "tracing-log"], optional = true }
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.23.1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { version = "1", optional = true }
rayon = { workspace = true, optional = true }
goblin = { version = "0.10", optional = true }
iced-x86 = { version = "1.21", optional = true }
image_dds = { workspace = true, features = ["ddsfile", "image"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"], optional = true }
png = { workspace = true, optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
bun-steam = { workspace = true, features = ["depot"], optional = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
reqwest = { workspace = true, features = ["http2", "rustls", "stream"], optional = true }
steamroom = { workspace = true, optional = true }
aphrody-nie-index = { path = "../aphrody-nie-index", version = "1.4.8", features = ["host"], optional = true }
aphrody-nie-seed = { path = "../aphrody-nie-seed", version = "1.4.8", features = ["host"], optional = true }
aphrody-nie-queue = { path = "../aphrody-nie-queue", version = "1.4.8", features = ["host"], optional = true }
aphrody-re = { package = "yolo-re-core", path = "../yolo-re-core", version = "1.4.8", default-features = false, features = ["nie"], optional = true }
aphrody-nie-trace = { path = "../aphrody-nie-trace", version = "1.4.8", features = ["host"], optional = true }
aphrody-nie-computer-use = { path = "../aphrody-nie-computer-use", version = "1.4.8", features = ["host"], optional = true }
aphrody-nie-viola = { path = "../aphrody-nie-viola", version = "1.4.8", optional = true }
aphrody-nie-launcher = { path = "../aphrody-nie-launcher", version = "1.4.8", optional = true }
aphrody-nie-lua = { path = "../aphrody-nie-lua", version = "1.4.8", features = ["host"], optional = true }
aphrody-nie-wiki = { path = "../aphrody-nie-wiki", version = "1.4.8", optional = true }
aphrody-nie-zukan = { path = "../aphrody-nie-zukan", version = "1.4.8", optional = true }
aphrody-nie-ocgen = { path = "../aphrody-nie-ocgen", version = "1.4.8", features = ["cli"], optional = true }
redis = { workspace = true, features = ["r2d2"], optional = true }
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros", "schemars"], optional = true }
ignore = { version = "0.4", optional = true }
globset = { version = "0.4", optional = true }
grep-searcher = { version = "0.1", optional = true }
grep-regex = { version = "0.1", optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }

[dev-dependencies]
aphrody-nie-pe = { workspace = true }
