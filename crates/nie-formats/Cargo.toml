[package]
build = "build.rs"
name = "nie-formats"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Level-5 and Criware binary format parsers for reverse engineering"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[features]
crlib = ["std", "serde"]
default = ["std", "serde", "lua", "remote-vfs"]
std = ["dep:crc32fast", "crc32fast/std", "dep:tempfile", "dep:base64", "glam/std", "serde_json/std"]
remote-vfs = [
  "std",
  "dep:opendal",
  "dep:opendal-http-transport-reqwest",
  "dep:nie-ssh",
  "dep:nie-tls",
  "dep:russh-sftp",
  "dep:tokio",
]
serde = ["dep:serde"]
lua = ["dep:nie-lua"]
textures = ["std", "dep:image_dds", "dep:png"]
images = ["std", "dep:image", "dep:png"]
textures-encode = ["textures", "image_dds/encode"]
audio-decode = ["std", "dep:cridecoder"]
real-fixtures = ["std"]

[dependencies]
glam = { version = "0.33.12", default-features = false, features = ["libm"] } # same family as bevy_math 0.20 (one glam in Cargo.lock)
crc32fast = { workspace = true, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
aes = { version = "0.9", default-features = false }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true }
image_dds = { version = "0.7", default-features = false, optional = true }
png = { version = "0.18.1", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "gif", "jpeg", "bmp", "tga", "tiff", "qoi"], optional = true }
cridecoder = { version = "0.3.7", default-features = false, optional = true }
tempfile = { version = "3.27.0", default-features = false, features = ["getrandom"], optional = true }
nie-lua = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
opendal = { workspace = true, optional = true }
opendal-http-transport-reqwest = { workspace = true, optional = true }
nie-ssh = { workspace = true, optional = true }
nie-tls = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "net", "time"], optional = true }

[dev-dependencies]
russh = { workspace = true }
futures-lite = { workspace = true }
tempfile = { workspace = true }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }
png = { version = "0.18.1", default-features = false }
opendal = { workspace = true, features = ["services-memory"] }

[[example]]
name = "g4tx_patch_region"
required-features = ["textures-encode"]

[[example]]
name = "model_glb_preview"
required-features = ["textures"]

[[example]]
name = "probe_g4tg"
required-features = ["textures"]

[[example]]
name = "probe_g4tg_swizzle"
required-features = ["textures"]

[[example]]
name = "export_tex_png"
required-features = ["textures"]
