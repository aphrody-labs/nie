name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: engine, craft and headless match
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # rust-toolchain.toml pins the compiler, its components and the wasm32 target.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -p nie-model -p nie-physics -p nie-input -p nie-ai -p nie-net -p nie-sim -p nie-craft
      - name: Test
        # Includes the pinned 5v5 headless match and the two-peer lockstep netplay test.
        run: cargo test --locked -p nie-model -p nie-physics -p nie-input -p nie-ai -p nie-net -p nie-sim -p nie-craft
      - name: Validate every manifest
        run: for manifest in games/*.toml; do cargo run --locked -q -p nie-craft -- check "$manifest"; done
      - name: Headless vertical slice
        # Plays the Pocket Derby manifest for 1200 ticks and asserts the exact score.
        run: cargo run --locked -q -p nie-craft -- run games/pocket-derby.toml --ticks 1200 --expect "${SLICE_SCORE}"
        env:
          SLICE_SCORE: "0-1"

  frontends:
    name: frontends (Bevy 3D, studio, Dioxus)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # Bevy, winit and eframe link against ALSA, udev, Wayland and xkbcommon through pkg-config.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the Bevy 3D game, the studio and the Dioxus app
        run: cargo clippy --locked --all-targets -p nie-render -p nie-game -p nie-studio -p nie-web
      - name: Check the Dioxus app as WebAssembly
        run: cargo check --locked -p nie-web --target wasm32-unknown-unknown
