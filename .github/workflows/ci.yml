name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  native:
    name: headless asset load (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic CPK through Bevy's AssetServer, VFS and remote transports
        # Builds a CPK archive in a temp directory and loads bytes and a texture through
        # `game://`. No game file is involved.
        run: cargo test --locked -p nie-assets -p nie-formats --lib --tests

  workspace:
    name: workspace (every crate, every target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # Bevy and winit link against ALSA, udev, Wayland and xkbcommon through pkg-config.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lint the whole workspace, warnings denied
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Bevy asset integration
        run: cargo check --locked -p nie-bevy --features bevy --all-targets
