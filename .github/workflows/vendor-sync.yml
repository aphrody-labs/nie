# Keeps the vendored forks (vendor/bevy, vendor/dioxus) current: runs each fork's own rg-sync
# (upstream merge plus green upstream fix PRs), bumps the submodule pointers, proves the bump
# with a workspace check and the headless asset test, and pushes it to main only when green.
# A red bump opens a pull request instead, so main never carries a pointer that does not build.
name: vendor-sync

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      dispatch_forks:
        description: "Run the forks' rg-sync before bumping"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendor-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  FORK_OWNER: aphrody-labs
  # Forks vendored as submodules; the names match the paths under vendor/.
  FORKS: bevy dioxus

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Token for the forks and this repository
        id: app
        # Needed to dispatch the forks' workflows and to push a commit that triggers CI. Without a
        # usable app key the job still bumps and verifies with the repository token.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APHRODY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULES_APP_KEY }}
          owner: ${{ env.FORK_OWNER }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          submodules: false
          fetch-depth: 0

      - name: Run rg-sync on every fork
        if: steps.app.outcome == 'success' && (github.event_name == 'schedule' || inputs.dispatch_forks)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          for fork in $FORKS; do
            repo="$FORK_OWNER/$fork"
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run rg-sync.yml -R "$repo" --ref main
            run_id=""
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(gh run list -R "$repo" --workflow rg-sync.yml --event workflow_dispatch \
                --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$since\")] | first | .databaseId // empty")
              [ -n "$run_id" ] && break
            done
            [ -n "$run_id" ] || { echo "::error::rg-sync did not start on $repo"; exit 1; }
            gh run watch "$run_id" -R "$repo" --exit-status --interval 20
          done

      - name: Report a missing fork token
        if: steps.app.outcome != 'success'
        run: echo "::warning::no GitHub App token (SUBMODULES_APP_KEY unreadable); skipped the fork rg-sync dispatch, bumping to whatever the forks already carry"

      - name: Point every submodule at its fork's main
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 --remote
          if git diff --quiet -- vendor; then
            echo "BUMP=false" >> "$GITHUB_ENV"
            echo "vendored forks already current"
          else
            echo "BUMP=true" >> "$GITHUB_ENV"
            git diff --submodule=short -- vendor
          fi

      - name: System libraries
        if: env.BUMP == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - name: Toolchain
        if: env.BUMP == 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: env.BUMP == 'true'

      - name: Check the bump (workspace, then the headless asset test)
        id: verify
        if: env.BUMP == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo check --workspace --all-targets
          cargo test -p nie-assets

      - name: Push the bump to main when green, open a pull request when red
        if: env.BUMP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          git config user.name "nie-vendor-sync"
          git config user.email "vendor-sync@users.noreply.github.com"
          git add vendor Cargo.lock
          git commit -m "vendor: bump the Bevy and Dioxus forks to their current main"
          if [ "$VERIFY" = "success" ]; then
            git push origin HEAD:main
          else
            branch="vendor-sync/$(date -u +%Y%m%d)"
            git push --force origin "HEAD:refs/heads/$branch"
            gh pr create --base main --head "$branch" \
              --title "vendor: bump forks (needs a fix)" \
              --body "The fork bump does not pass the workspace check or the headless asset test. See the vendor-sync run for the error." \
              || gh pr edit "$branch" --body "Still failing after the latest bump; see the latest vendor-sync run."
            exit 1
          fi
