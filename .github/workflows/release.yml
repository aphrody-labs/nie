name: Release

# Tag `v<workspace version>` publishes the binaries on the GitHub Release, the release manifest and the R2 layout served by the edge Worker.
# `workflow_dispatch` runs every build and publishes the workspace version on the chosen channel (default dev, a pre-release `<channel>-v<version>`).
# Publishing is the shared release workflow of the ay SDK repository (checksums, manifest, provenance, GitHub Release, R2); the matrix is its release.toml [products.nie].

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (lts, stable, preview, canary, nightly, dev)
        type: choice
        default: dev
        options: [lts, stable, preview, canary, nightly, dev]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      toolchain: ${{ steps.v.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - id: v
        run: just ci-release-version

  app:
    name: browser app bundle
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - run: just ci-release-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-bundle
          path: dist/app
          if-no-files-found: error

  linux:
    name: x86_64-unknown-linux-musl
    needs: [version, app]
    # Static musl binaries: no glibc baseline, so the runner image does not matter.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.version.outputs.toolchain }}
      NIE_APP_DIST: ${{ github.workspace }}/app-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-bundle
          path: app-bundle
      - run: just ci-release-linux "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: x86_64-pc-windows-msvc
    needs: [version, app]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.version.outputs.toolchain }}
      NIE_APP_DIST: ${{ github.workspace }}/app-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-bundle
          path: app-bundle
      - run: just ci-release-windows "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish nie
    needs: [version, linux, windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: aphrody-labs/ay/.github/workflows/release.yml@main
    with:
      product: nie
      version: ${{ needs.version.outputs.version }}
      channel: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || inputs.channel || 'dev' }}
      tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('{0}-v{1}', inputs.channel || 'dev', needs.version.outputs.version) }}
      commit: ${{ github.sha }}
      artifacts-pattern: release-*
      tools-repository: aphrody-labs/ay
    secrets: inherit
