name: Release

# Tag `v<workspace version>` to publish the binaries on the GitHub Release.
# `workflow_dispatch` runs every build without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "true"
  # Features of the shipped binaries: `host` is the full CLI (MCP, Lua, wiki, RE).
  CLI_FEATURES: nie-cli/host,nie-model-serve/host

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      toolchain: ${{ steps.v.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Workspace version, and tag agreement
        shell: bash
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && $1=="version"{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          toolchain=$(awk -F'"' '/^channel/{print $2; exit}' rust-toolchain.toml)
          test -n "$version" && test -n "$toolchain"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "toolchain=${toolchain}" >> "$GITHUB_OUTPUT"

  linux:
    name: x86_64-unknown-linux-musl
    needs: version
    # Static musl binaries: no glibc baseline, so the runner image does not matter.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --no-self-update --target x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build nie, nie-model-serve (host profile) and nie-deploy
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --no-default-features -p nie-cli -p nie-model-serve -p nie-deploy --features "${CLI_FEATURES}" --bin nie --bin nie-model-serve --bin nie-deploy
      - name: Smoke test
        run: |
          d=target/x86_64-unknown-linux-musl/release
          for b in nie nie-model-serve nie-deploy; do "$d/$b" --version; file "$d/$b" | grep -q "statically linked"; done
      - name: Archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="nie-v${VERSION}-x86_64-unknown-linux-musl"
          d=target/x86_64-unknown-linux-musl/release
          mkdir -p "dist/${name}"
          cp "$d/nie" "$d/nie-model-serve" "$d/nie-deploy" LICENSE LICENSE-APACHE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: x86_64-pc-windows-msvc
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build nie.exe and nie-model-serve.exe (host profile)
        shell: bash
        run: cargo build --locked --release --no-default-features -p nie-cli -p nie-model-serve --features "${CLI_FEATURES}" --bin nie --bin nie-model-serve
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/nie.exe --version
          ./target/release/nie-model-serve.exe --version
      - name: Archive
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $name = "nie-v$($env:VERSION)-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/nie.exe, target/release/nie-model-serve.exe, LICENSE, LICENSE-APACHE, README.md -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            --title "nie ${VERSION}"
