name: key-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.APHRODY_APP_KEY }}
          OLD: ${{ secrets.SUBMODULES_APP_KEY }}
        run: |
          for name in KEY OLD; do
            v="${!name}"
            echo "$name length=${#v} lines=$(printf '%s' "$v" | wc -l) begins_pem=$([[ "$v" == -----BEGIN* ]] && echo yes || echo no) literal_backslash_n=$([[ "$v" == *'\n'* ]] && echo yes || echo no) kind=$(printf '%s' "$v" | head -1 | grep -o '^-----BEGIN [A-Z ]*-----' || echo none) b64=$(printf '%s' "$v" | base64 -d 2>/dev/null | head -c 10 | grep -c BEGIN)"
          done
