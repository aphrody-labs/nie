name: GUI

# The GPUI workspace (gui/) builds against the vendor/zed submodule, which public CI skips by
# default (`update = none`): the recipes check it out explicitly.

on:
  push:
    branches: [main]
    paths: ["gui/**", "vendor/zed", "xtask/src/zed_branch.rs", "justfile", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "vendor/zed", "xtask/src/zed_branch.rs", "justfile", ".github/workflows/gui.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: gpui (linux, snapshots and AccessKit audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gui
      - run: just ci-gui-linux
      - name: Archive the dumped accessibility trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-trees
          path: /tmp/nie-ui-*-a11y.json
          if-no-files-found: ignore

  windows:
    name: gpui (windows-msvc check)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gui
      - run: just ci-gui-windows

  wasm:
    name: gpui (wasm32 build of the browser app)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gui
      - run: just ci-gui-wasm
