# Publication npm sans jeton (trusted publisher npm : le workflow appelant est ce fichier).
name: npm-publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Dossiers des paquets, relatifs au dépôt, séparés par des espaces"
        required: true
      dry_run:
        description: "npm publish --dry-run"
        type: boolean
        default: true
      tag:
        description: "dist-tag"
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Pack and publish
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for dir in $PACKAGES; do
            (cd "$dir" && bun pm pack --destination "$RUNNER_TEMP")
          done
          for tgz in "$RUNNER_TEMP"/*.tgz; do
            bunx npm@latest publish "$tgz" --provenance --access public --tag "$TAG" $([ "$DRY_RUN" = true ] && echo --dry-run)
          done
