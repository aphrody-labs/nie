name: Setup Bun
description: >-
  Installs upstream Bun (oven-sh/bun) with the official oven-sh/setup-bun action.
  The 1.4.5 line is only published as canary (latest stable: 1.4.4), hence the default.
inputs:
  bun-version:
    description: Bun version, tag or channel (canary, latest)
    default: canary
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - shell: bash
      run: bun --revision
